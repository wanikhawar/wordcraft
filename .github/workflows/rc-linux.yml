name: RC Linux AppImage
run-name: RC Linux ${{ inputs.rc_branch }} @ ${{ inputs.rc_sha }}

on:
  workflow_dispatch:
    inputs:
      rc_branch:
        description: Fork RC branch (rc/<name>)
        required: true
        type: string
      rc_sha:
        description: Full commit SHA at the RC branch tip
        required: true
        type: string

permissions:
  contents: read

jobs:
  appimage:
    if: github.repository == 'wanikhawar/wordcraft' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    steps:
      - name: Validate inputs
        shell: bash
        env:
          RC_BRANCH: ${{ inputs.rc_branch }}
          RC_SHA: ${{ inputs.rc_sha }}
        run: |
          [[ "$RC_BRANCH" == rc/?* ]]
          git check-ref-format "refs/heads/$RC_BRANCH"
          [[ "$RC_SHA" =~ ^[0-9a-f]{40}$ ]]
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/${{ inputs.rc_branch }}
          persist-credentials: false
      - name: Verify checked-out commit
        shell: bash
        env:
          RC_SHA: ${{ inputs.rc_sha }}
        run: test "$(git rev-parse HEAD)" = "$RC_SHA"
      - uses: storytold/craft-common-actions/actions/checkout-craft-fonts@1d1155edbf734eca3a7e94566cc8cdcd30d4f036
        with:
          ref: b076417b5880bd4154bd22f00695b1d28c6bea83
      - name: Require the RC language-data pin
        run: test -s craft-i18n.rev
      - uses: storytold/craft-common-actions/actions/checkout-craft-i18n@1d1155edbf734eca3a7e94566cc8cdcd30d4f036
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev \
            libxrandr-dev libxi-dev libgtk-3-dev libfontconfig1-dev libfreetype-dev \
            libgl1-mesa-dev libasound2-dev desktop-file-utils appstream zsync
      - id: rust
        uses: storytold/craft-common-actions/actions/rust-channel@1d1155edbf734eca3a7e94566cc8cdcd30d4f036
      - uses: step-security/dtolnay-rust-toolchain@8dd607977d06adf4ed49b190381e74c17a9dd25f # v1.0.0
        with:
          toolchain: ${{ steps.rust.outputs.toolchain }}
      - name: Package AppImage
        env:
          CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
          CRAFT_FONTS_REQUIRED: "1"
        run: bash packaging/linux/package.sh --formats appimage
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rc-linux-x86_64-${{ inputs.rc_sha }}
          path: dist/release/*.AppImage
          if-no-files-found: error
